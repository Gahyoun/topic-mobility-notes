<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>연구 노트</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard-gov/dist/web/variable/pretendardvariable-gov-dynamic-subset.css">
  <link rel="stylesheet" href="assets/katex-0.19.1/katex.min.css">
  <link rel="stylesheet" href="assets/style.css?v=typography-20261113">
</head>
<body>
  <div id="app">
    <a class="skip" href="#unlock-main">본문 바로가기</a>
    <header class="top">
      <div class="top-in"><span class="brand">연구 노트</span></div>
    </header>
    <main class="lock" id="unlock-main" tabindex="-1">
      <form id="unlock">
        <h1>비공개 연구 노트</h1>
        <p>연구 노트를 열려면 전달받은 비밀번호를 입력하세요.</p>
        <label for="pw">비밀번호</label>
        <input id="pw" type="password" autocomplete="current-password" aria-describedby="err" required>
        <p class="err" id="err" role="alert"></p>
        <button type="submit">노트 열기</button>
      </form>
      <noscript><p>노트를 열려면 브라우저에서 JavaScript를 사용 설정하세요.</p></noscript>
    </main>
  </div>
  <script src="assets/architecture.js?v=krds-20261113" defer></script>
  <script src="assets/app.js?v=typography-20261113" defer></script>
</body>
</html>
