<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>첫 임용 전후 분석 표본 흐름</title>
<style>
:root{color-scheme:light;--ink:#142843;--muted:#465e7a;--line:#dbe7f4;--blue:#235fa8;font:15px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink);background:#fff}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1100px;margin:auto;padding:22px clamp(16px,4vw,38px) 24px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(22px,3.2vw,32px);line-height:1.25;letter-spacing:-.03em;margin:4px 0}
p{margin:0}
.kicker{color:var(--blue);font-size:12px;font-weight:750;letter-spacing:.07em}
.caption{color:var(--muted);font-size:13px;margin-top:7px}
label{color:var(--muted);display:flex;align-items:center;gap:8px;font-size:13px}
select{font:inherit;font-size:16px;padding:7px 10px;border:1px solid #b4c9e4;border-radius:6px;color:var(--ink);background:#f6faff}
.summary{display:flex;gap:8px 30px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:14px;color:var(--muted);font-size:13px}
.summary strong{color:var(--blue);font-size:24px;margin-left:7px;font-variant-numeric:tabular-nums}
.chart-scroll{overflow-x:auto;margin-inline:-3px;padding:0 3px}
svg{display:block;width:100%;min-width:840px;height:auto;overflow:visible}
.stage-title{fill:var(--ink);font-size:14px;font-weight:670}
.stage-value{fill:var(--ink);font-size:26px;font-weight:770;font-variant-numeric:tabular-nums}
.stage-index{fill:var(--blue);font-size:11px;font-weight:720;letter-spacing:.08em}
.branch-label{fill:var(--muted);font-size:13px}
.branch-value{fill:var(--ink);font-size:13px;font-weight:740;font-variant-numeric:tabular-nums}
.measurements{display:flex;flex-wrap:wrap;gap:4px 18px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.measurements strong{color:var(--ink);font-variant-numeric:tabular-nums}
.scroll-label{display:none;font-size:12px;color:var(--muted);margin-top:4px}
@media(max-width:880px){.scroll-label{display:block}}
</style>
<main>
  <header>
    <div><p class="kicker">2025년 출판 마감 · 누적 명부</p><h1>첫 임용 전후 분석 표본 흐름</h1>
    <p class="caption">임용 다음 해부터 관측된 자료를 사용한다. 리본 폭은 각 분야의 명부 행 수에 비례한다.</p></div>
    <label>분야 <select id="field"></select></label>
  </header>
  <div class="summary" aria-live="polite" id="summary"></div>
  <div class="chart-scroll" role="region" aria-label="분석 표본 흐름도" tabindex="0">
    <svg id="flow" viewBox="0 0 980 612" role="img" aria-labelledby="flow-title flow-description">
      <title id="flow-title">누적 명부에서 첫 임용 전후 지표 산출까지</title>
      <desc id="flow-description"></desc>
      <defs>
        <linearGradient id="continue-fill" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
          <stop stop-color="#d6e8fa"/><stop offset="1" stop-color="#91b9e3"/>
        </linearGradient>
        <linearGradient id="hold-fill" x1="0" y1="0" x2="1" y2="0">
          <stop stop-color="#d2e1f0"/><stop offset="1" stop-color="#a3b6ce"/>
        </linearGradient>
      </defs>
      <g id="marks"></g>
    </svg>
  </div>
  <p class="scroll-label">옆으로 이동하면 단계별 보류 사유를 볼 수 있다.</p>
  <div class="measurements" id="metrics"></div>
  <p class="caption">지표 산출 행에는 신호가 0인 경우도 포함된다. 세 분석은 수렴·확산, 연간 병행, 분기다.</p>
</main>
<script id="aggregates" type="application/json">@@COUNTS@@</script>
<script>
(() => {
  const data=JSON.parse(document.getElementById('aggregates').textContent);
  const select=document.getElementById('field');
  select.replaceChildren(...Object.entries(data).map(([v,o])=>new Option(o.label,v)));
  const fmt=new Intl.NumberFormat('ko-KR');
  const marks=document.getElementById('marks');
  const ns='http://www.w3.org/2000/svg';
  const stages=[
    ['누적 명부','roster',[['연결 논문 없음','no_link'],['참고문헌 없음','no_reference']]],
    ['참고문헌 확보','references',[['첫 임용연도 미확인','no_date']]],
    ['첫 임용연도 근거 있음','dated',[['임용 후 관측연도 미도달','no_followup'],['추적 기간에 후기 논문 0편','post_zero'],['임용 전 논문 0편','pre_zero']]],
    ['전후 논문 각각 1편 이상','pre_post',[['전후 중 한쪽에 GCC 좌표 없음','no_gcc_both'],['양쪽에 GCC 좌표 있음 · 지표 미산출','gcc_unmeasured']]],
    ['한 분석 이상 산출','any',[['두 분석만 산출','two_only'],['한 분석만 산출','one_only']]],
    ['세 분석 모두 산출','all_metrics',[]],
  ];
  const metrics=[['수렴·확산','transport'],['연간 병행','parallel'],['분기','branch']];
  function element(tag,attrs={},text) {
    const el=document.createElementNS(ns,tag);
    for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
    if(text!=null) el.textContent=text;
    return el;
  }
  function ribbon(xa,y,xb,z,w,fill) {
    const mid=(y+z)/2;
    return element('path',{
      d:'M'+xa+' '+y+' C'+xa+' '+mid+' '+xb+' '+mid+' '+xb+' '+z+
        ' L'+(xb+w)+' '+z+' C'+(xb+w)+' '+mid+' '+(xa+w)+' '+mid+' '+(xa+w)+' '+y+' Z',
      fill
    });
  }
  function draw() {
    const {label,counts}=data[select.value];
    const n=key=>counts[key]||0;
    const x=270;
    const levels=[38,142,246,350,454,558];
    const scale=334/n('roster');
    marks.replaceChildren();
    stages.forEach(([title,key,branches],i)=>{
      if(i===stages.length-1) return;
      const y=levels[i],next=levels[i+1];
      const keep=n(stages[i+1][1]);
      marks.append(ribbon(x,y,x,next,keep*scale,'url(#continue-fill)'));
      let source=x+n(key)*scale;
      const valid=branches.filter(([,key])=>n(key)>0);
      valid.forEach(([title,key],j)=>{
        const width=n(key)*scale;
        source-=width;
        const end=y+28+j*24;
        const finish=680-width/2;
        const group=element('g');
        group.append(element('title',{},title+' '+fmt.format(n(key))+'행'));
        group.append(ribbon(source,y,finish,end,width,'url(#hold-fill)'));
        group.append(element('line',{x1:680,x2:704,y1:end,y2:end,stroke:'#9eb4cf','stroke-width':1}));
        group.append(element('circle',{cx:704,cy:end,r:3,fill:'#6889ad'}));
        group.append(element('text',{x:716,y:end+4,class:'branch-label'},title));
        group.append(element('text',{x:974,y:end+4,class:'branch-value','text-anchor':'end'},fmt.format(n(key))));
        marks.append(group);
      });
    });
    stages.forEach(([title,key],i)=>{
      const y=levels[i];
      marks.append(element('line',{x1:0,x2:x-24,y1:y+44,y2:y+44,stroke:'#e5eef8'}));
      marks.append(element('text',{x:0,y:y-4,class:'stage-index'},String(i+1).padStart(2,'0')));
      marks.append(element('text',{x:30,y:y-4,class:'stage-title'},title));
      marks.append(element('text',{x:30,y:y+34,class:'stage-value'},fmt.format(n(key))));
      marks.append(element('rect',{x,y:y-4,width:n(key)*scale,height:8,rx:2,fill:i>3?'#225fa7':'#467fbc'}));
    });
    const summary=document.getElementById('summary');
    summary.replaceChildren(...[['한 분석 이상','any'],['세 분석 모두','all_metrics']].map(([label,key])=>{
      const span=document.createElement('span');
      span.textContent=label;
      const b=document.createElement('strong');
      b.textContent=fmt.format(n(key))+'행';
      span.append(b);
      return span;
    }));
    document.getElementById('metrics').replaceChildren(...metrics.map(([label,key])=>{
      const span=document.createElement('span');
      span.textContent=label+' ';
      const b=document.createElement('strong');
      b.textContent=fmt.format(n(key))+'행';
      span.append(b);
      return span;
    }));
    document.getElementById('flow-description').textContent=label+' · '+stages.map(([label,key])=>label+' '+fmt.format(n(key))+'행').join(', ');
  }
  select.addEventListener('change',draw);
  draw();
})();
</script>
</html>
